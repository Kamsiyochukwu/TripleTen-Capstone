name: ML Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test pipeline and interface
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt "dvc[http]"

      - name: Configure DagsHub DVC credentials
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          test -n "$DAGSHUB_USERNAME" && test -n "$DAGSHUB_TOKEN"
          dvc remote add --force --default origin https://dagshub.com/Kamsiyochukwu/TripleTen-Capstone.dvc
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USERNAME"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      - name: Pull dataset from DagsHub DVC
        run: dvc pull data/athlete_events.csv.dvc

      - name: Run tests
        run: pytest tests/ -v --tb=short

  train:
    name: Train and evaluate models
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt "dvc[http]"

      - name: Configure DagsHub DVC credentials
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          test -n "$DAGSHUB_USERNAME" && test -n "$DAGSHUB_TOKEN"
          dvc remote add --force --default origin https://dagshub.com/Kamsiyochukwu/TripleTen-Capstone.dvc
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USERNAME"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      - name: Pull dataset from DagsHub DVC
        run: dvc pull data/athlete_events.csv.dvc

      - name: Train model configurations
        run: python -m src.train

      - name: Compare MLflow runs
        run: |
          mkdir -p metrics
          python -m src.evaluate | tee metrics/evaluation.txt

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: metrics/evaluation.txt
          if-no-files-found: warn

      - name: Upload pickle model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: best-medal-model
          path: models/best_medal_model.plk
          if-no-files-found: error

"data_url": "data/athlete_events.csv"
"handle_missing": "median"
"target": "Medal"
"model_type": ["logistic_regression", "random_forest", "gradient_boosting", "neural_network"]
"test_size": [0.2, 0.25, 0.3, 0.35, 0.4]
"lr_C": 1.0
"random_state": 42
"rf_n_estimators": 150
"rf_max_depth": 14
"gb_n_estimators": 150
"gb_learning_rate": 0.08
"gb_max_depth": 3
"n_features": 7
"nn_hidden_layer_sizes": [96, 48]
"nn_activation": "relu"
"nn_solver": "adam"
"scale_features": true
"features_to_drop": ["ID", "NOC", "Name", "Team", "Games", "City", "Event"]
"sample_size": 40000
"tracking_uri": "sqlite:///mlflow.db"
"experiment_name": "olympic_medal_multiclass"
"artifact_path": "models/best_medal_model.joblib"
